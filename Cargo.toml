[package]
name = "steamroids"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
authors = ["mashen456"]
description = "Steam on steroids — a Rust client for the Steam CM and CS2 Game Coordinator, built for high-concurrency automation."
repository = "https://github.com/mashen456/steamroids"
license = "MIT"
keywords = ["steam", "valve", "cs2", "csgo", "websocket"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[features]
default = []
# Exposes the offline test seams (`SessionHandle::for_test`,
# `GameCoordinator::for_test`, `session::driver::Command`) to out-of-crate
# tests. Unsupported API; off in a normal build. Distinct from tokio's own
# `test-util` feature, which the dev-dependencies enable for time control.
test-seam = []

[dependencies]
# Async runtime
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# TLS + WebSocket
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = "0.26"
rustls-pki-types = "1.10"

# Proxy
tokio-socks = "0.5"

# Bytes / URL / encoding
bytes = "1.7"
url = "2.5"
base64 = "0.22"

# Steam gzip-compresses coalesced CM message batches (`Multi`). Pure-Rust
# backend (miniz_oxide) to avoid a C/zlib dependency.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Crypto (Steam TOTP = HMAC-SHA1)
hmac = "0.12"
sha1 = "0.10"

# Errors / logging / serde
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
# Used at runtime to decode JWT payloads to recover the SteamID.
serde_json = "1"

# HTTP client for the Steam WebAPI auth flow.
reqwest = { version = "0.12", default-features = false, features = [
    "http2",
    "rustls-tls-webpki-roots",
    "socks",
] }

# RSA encryption of the password for BeginAuthSessionViaCredentials.
rsa = { version = "0.9", default-features = false, features = ["std"] }

# Protobuf runtime (generated code uses these).
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"
# Bundles a protoc binary so users / CI don't need to install it system-wide.
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Loads a git-ignored .env for the opt-in live integration tests. Dev-only —
# never compiled into the published crate.
dotenvy = "0.15"
# Benchmarks (criterion) + prost for building protobuf inputs in bench setup.
criterion = "0.5"
prost = "0.13"
# Terminal QR rendering for example 12 only. Dev-only, not a library dep.
# No default features: skips the optional image/svg/pic renderers we don't use.
qrcode = { version = "0.14", default-features = false }

[[bench]]
name = "codec"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic exceptions — too noisy for early stage
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[[example]]
name = "01_totp"
path = "examples/01_totp.rs"

[[example]]
name = "02_proxy_test"
path = "examples/02_proxy_test.rs"

[[example]]
name = "03_ws_echo"
path = "examples/03_ws_echo.rs"

[[example]]
name = "04_signin_credentials"
path = "examples/04_signin_credentials.rs"

[[example]]
name = "05_signin_refresh_token"
path = "examples/05_signin_refresh_token.rs"
