name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --all-targets --workspace
        # --all-targets skips doctests, so run them explicitly
      - run: cargo test --doc --all-features

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  # Live tests against real Steam. Runs only on push (not pull_request) so
  # secrets are never exposed to fork PRs. `--include-ignored` opts in to the
  # full logins (2FA CM session, CS2 GC scan, friends API). STEAM_LIVE_REQUIRED
  # turns every soft-skip into a hard failure, so a missing secret fails the job
  # rather than leaving it green having tested nothing — configure the secrets
  # under Settings > Secrets and variables > Actions. For a real CS2 profile
  # scan, set STEAM_TEST_CS2_* to an account that owns CS2 (distinct from the
  # 2FA account) — unset, cs2_profile_scan falls back to the plain account,
  # which still gets a GC welcome because CS2 is free-to-play. So the mandatory
  # secrets are the 2FA and plain account credentials; STEAM_TEST_CS2_*,
  # STEAM_TEST_CS2_TARGET_ID and STEAM_TEST_PROXY_URL stay optional.
  #
  # STEAM_TEST_REFRESH_TOKEN is deliberately NOT a secret: Steam rotates a
  # refresh token on every successful use, so a stored one is stale the moment
  # anything redeems it. The mint step below issues a fresh one per run from the
  # plain account instead, which also makes refresh_token_flow prove something
  # better — that a just-issued token is accepted, not merely that an old JWT
  # has not expired yet.
  #
  # The two live steps run in order on the same runner: live_auth logs Account A
  # (2FA) in once and parks its refresh token at target/refresh_token_a.txt, then
  # live_friends reuses that token — so Account A is never logged in twice in the
  # same TOTP window (Steam rejects a reused 2FA code). Env is hoisted to the job
  # so both steps see the secrets.
  live:
    name: live (auth + friends)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # no silent skips in CI: unset secret => failure, not green
      STEAM_LIVE_REQUIRED: "1"
      STEAM_TEST_2FA_ACCOUNT: ${{ secrets.STEAM_TEST_2FA_ACCOUNT }}
      STEAM_TEST_2FA_PASSWORD: ${{ secrets.STEAM_TEST_2FA_PASSWORD }}
      STEAM_TEST_2FA_SHARED_SECRET: ${{ secrets.STEAM_TEST_2FA_SHARED_SECRET }}
      STEAM_TEST_PLAIN_ACCOUNT: ${{ secrets.STEAM_TEST_PLAIN_ACCOUNT }}
      STEAM_TEST_PLAIN_PASSWORD: ${{ secrets.STEAM_TEST_PLAIN_PASSWORD }}
      STEAM_TEST_CS2_ACCOUNT: ${{ secrets.STEAM_TEST_CS2_ACCOUNT }}
      STEAM_TEST_CS2_PASSWORD: ${{ secrets.STEAM_TEST_CS2_PASSWORD }}
      STEAM_TEST_CS2_SHARED_SECRET: ${{ secrets.STEAM_TEST_CS2_SHARED_SECRET }}
      STEAM_TEST_CS2_TARGET_ID: ${{ secrets.STEAM_TEST_CS2_TARGET_ID }}
      STEAM_TEST_PROXY_URL: ${{ secrets.STEAM_TEST_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Issue the token refresh_token_flow reuses. The plain account has no 2FA,
      # so this cannot collide with the 2FA account's TOTP window the way a
      # second Account A login would. Example 04 reads STEAM_ACCOUNT /
      # STEAM_PASSWORD / PROXY_URL, hence the rename. The token is captured by
      # command substitution (so it never reaches the log) and masked before it
      # is written anywhere. An empty capture is a hard failure: a silently
      # unset token would put us straight back to a test that skips itself.
      - name: mint a fresh refresh token
        run: |
          token=$(STEAM_ACCOUNT="$STEAM_TEST_PLAIN_ACCOUNT" \
                  STEAM_PASSWORD="$STEAM_TEST_PLAIN_PASSWORD" \
                  PROXY_URL="$STEAM_TEST_PROXY_URL" \
                  cargo run --quiet --example 04_signin_credentials \
                  | sed -n 's/^ *refresh_token *: *//p')
          if [ -z "$token" ]; then
            echo "::error::could not mint a refresh token from the plain account"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "STEAM_TEST_REFRESH_TOKEN=$token" >> "$GITHUB_ENV"
      - name: live auth logins
        run: cargo test --test live_auth -- --include-ignored --nocapture
      - name: live friends api
        run: cargo test --test live_friends -- --include-ignored --nocapture

  # Post the overall CI result to Discord. Push-only (so fork PRs never see the
  # webhook secret); always() so failures are reported too. Skips quietly if the
  # DISCORD_WEBHOOK secret is unset.
  notify:
    name: discord notification
    needs: [fmt, clippy, test, doc, live]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post result to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          OVERALL: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK not set; skipping notification."
            exit 0
          fi
          if [ "$OVERALL" = "success" ]; then
            title="✅ CI passed"; color=3066993
          else
            title="❌ CI failed"; color=15158332
          fi
          payload=$(jq -n \
            --arg title "$title" \
            --arg url "$RUN_URL" \
            --argjson color "$color" \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg actor "$ACTOR" \
            --arg commit "${SHA:0:7} ${MSG:0:280}" \
            '{embeds:[{title:$title, url:$url, color:$color, fields:[
               {name:"Repo",   value:$repo,   inline:true},
               {name:"Branch", value:$ref,    inline:true},
               {name:"By",     value:$actor,  inline:true},
               {name:"Commit", value:$commit, inline:false}
            ]}]}')
          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK"
