# cargo-audit configuration. Unlike .cargo/config.toml (a local, git-ignored
# linker workaround), this file IS committed — CI's Security audit job relies on
# it.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": timing sidechannel in the `rsa` crate.
    #
    # Not applicable to steamroids. The attack recovers an RSA *private* key by
    # observing the timing of decryption/signing. We only ever do *public-key*
    # encryption of the account password with Steam's public key
    # (src/auth/rsa_pw.rs) — we hold no private key and never decrypt or sign.
    # There is no patched `rsa` release yet, and a pure-Rust RSA implementation
    # is required for the Steam auth handshake. Revisit if `rsa` ships a fix.
    "RUSTSEC-2023-0071",
]
