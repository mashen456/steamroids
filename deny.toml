# cargo-deny configuration — run with `cargo deny check`

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin Attack timing sidechannel in `rsa`. Not applicable: we only do
    # public-key encryption (no private key to leak). See .cargo/audit.toml.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
